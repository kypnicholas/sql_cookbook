name: Keep Supabase Alive

concurrency:
  group: keep-supabase-alive
  cancel-in-progress: true

on:
  schedule:
    # Runs every Monday and Thursday at 00:00 UTC
    - cron: "0 0 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase and fail on non-200
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}")
          echo "status=$status"
          if [ "$status" -ne 200 ]; then echo "Ping failed (status $status)"; exit 1; fi