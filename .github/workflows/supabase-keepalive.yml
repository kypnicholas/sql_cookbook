name: Keep Supabase Alive

concurrency:
  group: keep-supabase-alive
  cancel-in-progress: true

on:
  schedule:
    # Runs every day at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Chinook database
        run: |
          status=$(curl -s -o /tmp/response -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/album?select=album_id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}")

          echo "HTTP status: $status"
          echo "Response:"
          cat /tmp/response

          if [ "$status" -ne 200 ]; then
            echo "Supabase database query failed"
            exit 1
          fi

          echo "Supabase database query successful"